[workspace]
resolver = "3"
members = ["crates/*"]
# The MIR lowerer needs nightly (rustc_public is nightly-only even to read);
# excluding it keeps the main workspace buildable on stable forever.
exclude = ["tools/rust-lower"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ngriaznov/vikt"

[workspace.dependencies]
vikt-core = { path = "crates/vikt-core" }
vikt-jvm = { path = "crates/vikt-jvm" }
vikt-js = { path = "crates/vikt-js" }
vikt-rs = { path = "crates/vikt-rs" }
vikt-py = { path = "crates/vikt-py" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# MokaIR — the SSA IR, CFG and def-use chains the JVM frontend lowers from —
# sits behind mokapot's `unstable-moka-ir` feature. The name is accurate: the
# module is `pub(crate)` without it, and the API carries no stability promise
# across 0.x releases. Pinned exactly, and bumped deliberately.
mokapot = { version = "=0.26.0", features = ["unstable-moka-ir"] }

[workspace.lints.rust]
unsafe_code = "deny"

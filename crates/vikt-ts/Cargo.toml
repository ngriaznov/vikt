[package]
name = "vikt-ts"
version = "0.1.0"
description = "Generic tree-sitter fallback frontend for vikt-core: one statement-granular walker driven by a per-language grammar table."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vikt-core = { workspace = true }
thiserror = { workspace = true }
tree-sitter = "=0.26.12"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-java = "=0.23.5"
# `-ng` (tree-sitter-grammars/tree-sitter-kotlin, the community successor):
# the original fwcd/tree-sitter-kotlin pins `tree-sitter <0.23` directly and
# drags the whole workspace's runtime down to 0.22. Never surfaced in the
# generator string - that's an implementation detail, not part of the API.
tree-sitter-kotlin-ng = "=1.1.0"

[lints]
workspace = true

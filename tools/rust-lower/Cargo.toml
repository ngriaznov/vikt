[package]
name = "vikt-rust-lower"
version = "0.1.0"
edition = "2021"
description = "Nightly-pinned MIR lowerer: emits vikt FunctionIr JSON via rustc_public. Deliberately OUTSIDE the stable workspace."
license = "MIT OR Apache-2.0"
# Ties itself to one nightly via rust-toolchain.toml; never meant for crates.io.
publish = false

# rustc_private crates come from the toolchain's rustc-dev component, not
# crates.io, so there are no dependencies to declare here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

